[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pantry_agent"
version = "0.0.1"
description = "Pantry Planner Agent (V0)"
requires-python = ">=3.10"
dependencies = [
  "flask>=2.3,<3.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
